name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.42.0

      - name: Lint all project markdown
        run: |
          set -e
          markdownlint --version
          markdownlint README.md docs/*.md \
            skills/opencode-acp-control/SKILL.md \
            skills/opencode-acp-control/references/*.md \
            skills/opencode-acp-control/assets/*.md \
            .github/ISSUE_TEMPLATE/*.md

  link-check:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract URLs from docs
        id: urls
        run: |
          set -euo pipefail
          {
            grep -rhoE 'https?://[A-Za-z0-9._/?#&+=%-]+' \
              README.md docs/ skills/opencode-acp-control/ \
              | grep -vE '\.(png|jpg|jpeg|gif|svg|ico|pdf)$' \
              | sort -u
          } > urls.txt
          echo "URLs to check: $(wc -l < urls.txt)"

      - name: Check URLs with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --timeout 15 --accept 200,203,206,301,302,303,307,308,403 --max-redirects 5 --exclude-loopback --exclude-mail urls.txt
          fail: true
          lycheeVersion: v0.15.1

  python-qa:
    name: python QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Lint with Ruff
        run: |
          set -e
          ruff check skills/opencode-acp-control/scripts/run.py
          ruff check tests/

      - name: Check shell and compile Python
        run: |
          set -e
          bash -n skills/opencode-acp-control/scripts/helper.sh
          python3 -m py_compile skills/opencode-acp-control/scripts/run.py
          python3 -m py_compile tests/fake_opencode.py tests/test_transport.py
          echo "OK: transport sources compile"

      - name: Run unit tests
        run: |
          set -e
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -v
